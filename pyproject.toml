[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekos-notifier"
dynamic = ["version"]
description = "Alerts, hourly digests and session records for KStars/Ekos astrophotography rigs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Anand Narwani" }]
keywords = ["astrophotography", "kstars", "ekos", "indi", "phd2", "notifications"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["dbus-fast>=2", "apprise>=1.6", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mkdocs-material>=9"]

[project.scripts]
ekos-notifier = "ekos_notifier.cli:main"

[project.urls]
Homepage = "https://github.com/anandvn/ekos-notifier"
Issues = "https://github.com/anandvn/ekos-notifier/issues"

[tool.hatch.version]
path = "src/ekos_notifier/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ekos_notifier"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
