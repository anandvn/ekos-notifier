# Ekos Notifier configuration — example
# Copy to ~/.config/ekos-notifier/config.yaml. Every key is optional; defaults are shown.
# `ekos-notifier config init` (and install.sh) writes this file for you to fill in.
# PRE-ALPHA: keys may change before 1.0.
#
# YAML in two lines: indent with spaces (never tabs), and keep a setting lined up with the ones
# around it. To use an example, delete the "#" and nothing else. After saving, check it with
# `ekos-notifier config check`; the running service applies it by itself within seconds.

# Where to send alerts. Any Apprise URL works: https://github.com/caronc/apprise/wiki
# Uncomment a line (or add your own) to turn alerts on; with none, Ekos Notifier only records.
notify:
  # - "pover://USER_KEY@APP_TOKEN"      # Pushover
  # - "ntfys://ntfy.sh/my-rig-topic"    # ntfy

# An alert that can't be delivered (no internet) is retried for this long, then dropped rather
# than sent late. It stays in the session record. 0 = try once, never retry.
notify_expire_minutes: 10

# Wording of messages: plain | terse | olde. NOT USED YET: every message is plain for now.
style: plain

# Hourly status digest while a session is running.
digest:
  enabled: true
  interval_minutes: 60
  align_to_clock: true     # on the hour, rather than N minutes from session start

# Optional dead-man's switch: a URL pinged every minute during a session.
# If pings stop, the service (e.g. Healthchecks.io) alerts you. Leave empty to disable.
# NOT USED YET (version 0.3).
heartbeat:
  url: ""
  grace_minutes: 30

# INDI devices, read only. The server is the active Ekos profile's; set host/port only to
# override it. Devices are recognised by presets (weather stations, camera and focuser
# temperatures so far). Map anything else yourself as metric: "Device / PROPERTY.ELEMENT";
# `ekos-notifier indi-dump` lists your devices' properties.
indi:
  host: ""
  port: 0
  metrics:
    # power.voltage: "My Old Box / VOLTAGE.VALUE"   # power boxes on INDI's standard power
    #                                               # interface are recognised without this
    # env.humidity: "My Sensor / HUMIDITY.VALUE"

# Battery alerts, from your power box's input voltage. battery: agm_12v (low 12.0 V, critical
# 11.5 V) | lifepo4_12v (12.8 V, 12.0 V) | mains (voltage alerts off) | custom. low_volts and
# critical_volts override the preset's levels (custom needs at least one).
power:
  battery: agm_12v
  # low_volts: 12.0        # Battery low (High), during a session, once
  # critical_volts: 11.5   # Battery critical (Emergency), at any time

# Which messages you get, and how. Every alert has a default (`ekos-notifier config alerts`
# lists them all); set any of them here to:
#   off        never sent, and left out of the digest (still recorded in the session)
#   digest     not sent on its own; listed in the next hourly digest
#   quiet      sent at once, silently
#   normal | high | emergency   sent at once at that priority (Emergency repeats on Pushover
#              until you acknowledge it)
# All-clears (guiding_recovered, battery_ok, …) follow their problem when that's off or digest.
messages:
  # phd2_warning: digest
  # twilight_coming: quiet
  # disk_low: emergency
  # digest: normal          # the hourly digest itself (default quiet)
  # darks_reminder: normal  # off by default: "cover the telescope" as darks start

# Alert thresholds.
alerts:
  dew_margin_c: 2.0              # Dew risk: ambient − dew point under this (or RH > 90 %) for
                                 # 5 min (0 = off)
  guiding_recovery_minutes: 5   # guiding lost this long (planned stops excluded) → High alert
  guiding_poor_minutes: 10      # guiding over Ekos's own guide-deviation limit this long →
                                # High "Guiding poor" (0 = off). The limit is Ekos's: set it in
                                # the Capture module's job settings.
  cooler_tolerance_c: 2.0        # Cooler can't hold / reach: this far above the setpoint
                                 # (0 = off)
  disk_low_gb: 10                # Disk low: under this many GB free where Ekos saves frames
                                 # (0 = off)
  clouds_drop_percent: 50        # Clouds: the guide star's SNR, or a frame's star count, falls
                                 # by this % from what's typical (0 = off). A first guess:
                                 # tell us what your cloudy nights look like.
  twilight_warning_minutes: 45     # before astronomical dawn (site from KStars's location)
  target_low_warning_minutes: 30   # before the target sinks below Ekos's altitude limit

# Carry data home with rclone. dest is any rclone remote:path or a local path (USB drive).
# NOT USED YET (version 0.3).
sync:
  dest: ""                 # e.g. "nas:astro/sessions" or "/run/media/me/USB/astro"
  include_fits: false
  auto_when_reachable: true

# Local web dashboard (LAN only). NOT USED YET (version 0.2).
gui:
  port: 8765
  night_mode: auto

# NOT USED YET.
units:
  temperature: C           # C | F
  guide_error: arcsec      # arcsec | px
  clock: 24h               # 24h | 12h

# NOT USED YET.
privacy:
  round_site_coordinates: false
