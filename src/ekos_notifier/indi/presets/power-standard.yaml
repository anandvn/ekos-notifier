# Any INDI power box or dew controller on libindi's standard PowerInterface (libindi 2.x):
# Pegasus PPB/PPBA/SPB/UPB/UPB3, SVBONY, Terrans, Celestron Dew Power, Gemini PBH, smPro, … .
# Each output's on/off, current and label (POWER_CHANNELS, POWER_CURRENTS, POWER_LABELS and the
# DEW_* equivalents) are read by the decoder itself, since their number varies by box.
name: INDI power box (standard power interface)
status: verified
verified_with: a test driver on libindi 2.2.5's INDI::PowerInterface
match:
  interface: power
metrics:
  power.voltage: POWER_SENSORS.SENSOR_VOLTAGE
  power.current: POWER_SENSORS.SENSOR_CURRENT
  power.watts: POWER_SENSORS.SENSOR_POWER
